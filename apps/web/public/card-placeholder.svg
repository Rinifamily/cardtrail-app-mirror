<svg width="588" height="866" viewBox="0 0 588 866" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->

  <rect x="0" y="0" width="588" height="866" fill="#ffffff"/>



  <!-- Top empty area (like placeholder layout) -->

  <rect x="0" y="0" width="588" height="220" fill="#ffffff"/>



  <!-- Icon group center -->

  <g transform="translate(0, 250)">

    <!-- Fanned cards behind -->

    <g opacity="0.9">

      <rect x="170" y="40" width="90" height="120" rx="12" fill="#e6e6e6" transform="rotate(-18 215 100)"/>

      <rect x="245" y="20" width="98" height="130" rx="12" fill="#d9d9d9"/>

      <rect x="330" y="40" width="90" height="120" rx="12" fill="#e6e6e6" transform="rotate(18 375 100)"/>

    </g>



    <!-- Cute Pokeball in front -->

    <g transform="translate(244, 35)">

      <!-- Outer circle -->

      <circle cx="50" cy="65" r="54" fill="#f2f2f2" stroke="#7a7a7a" stroke-width="6"/>

      <!-- Top half -->

      <path d="M-4,65 A54,54 0 0 1 104,65" fill="#d0d0d0"/>

      <!-- Middle line -->

      <line x1="-2" y1="65" x2="102" y2="65" stroke="#7a7a7a" stroke-width="6"/>

      <!-- Center button -->

      <circle cx="50" cy="65" r="16" fill="#ffffff" stroke="#7a7a7a" stroke-width="6"/>

      <circle cx="50" cy="65" r="6" fill="#bfbfbf"/>

      <!-- Small sparkle for cute vibe -->

      <circle cx="82" cy="34" r="4" fill="#8c8c8c"/>

      <circle cx="90" cy="26" r="2.8" fill="#b0b0b0"/>

    </g>

  </g>



  <!-- Brand text -->

  <text x="294" y="565"

        text-anchor="middle"

        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"

        font-size="64"

        font-weight="800"

        fill="#b3b3b3"

        letter-spacing="2">

    CARDTRAIL

  </text>



  <!-- Chinese hint text -->

  <text x="294" y="650"

        text-anchor="middle"

        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"

        font-size="40"

        font-weight="700"

        fill="#111111">

    图片正在准备中

  </text>



  <!-- Soft bottom spacer -->

  <rect x="0" y="700" width="588" height="166" fill="#ffffff"/>

</svg>

